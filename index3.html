<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>RFM Hex — panels, typography, materials, glow (full)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }

    html, body {
      margin: 0; height: 100%;
      display: flex; flex-direction: column;
      font: 14px/1.35 system-ui, sans-serif;
      background: -webkit-radial-gradient(top, #00b8ff, #14142f);
    }

    /* ===== TOPBAR ===== */
    .topbar {
      padding: 12px;
      display: flex; flex-direction: column; gap: 10px;
      background: linear-gradient(#0f1012, #0f1012cc);
      border-bottom: 1px solid #222;
    }
    .panel-toggles { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .chip {
      display: flex; gap: 8px; align-items: center;
      padding: 6px 10px; border-radius: 8px;
      border: 1px solid #222; background: #000a; color: #e5e7eb;
      font-size: 12px; cursor: pointer; user-select: none; backdrop-filter: blur(4px);
    }

    .panels { display: flex; gap: 10px; flex-wrap: wrap; }
    .ui {
      background: #0009; border: 1px solid #222; border-radius: 10px;
      padding: 12px 14px; color: #e5e7eb; backdrop-filter: blur(4px);
      min-width: 280px;
    }
    .ui.hidden { display: none; }
    .ui h3 { margin: 0 0 8px 0; font-size: 12px; opacity: .8; letter-spacing: .04em; text-transform: uppercase; }

    .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
    .row label { width: 200px; opacity: .9; font-size: 12px; }
    .row input[type=range] { flex: 1; }
    .row input[type=number], .row input[type=text] {
      width: 100px; background: #0e0f11; border: 1px solid #333;
      border-radius: 6px; color: #e5e7eb; padding: 4px 6px;
    }
    .row select {
      flex: 1; min-width: 220px; background: #0e0f11;
      border: 1px solid #333; color: #e5e7eb; border-radius: 6px; padding: 6px;
    }
    .row input[type=checkbox] { transform: translateY(1px); }

    /* сегменты-таблица */
    .seg-grid {
      display: grid;
      grid-template-columns: auto 200px 70px 90px 85px; /* Name | Label | Opacity | Gap+ | Outline */
      gap: 8px; align-items: center;
    }
    .seg-grid .hdr { opacity: .75; font-size: 12px; }
    .seg-name { width: 120px; }
    .seg-grid textarea {
      width: 100%;
      background: #0e0f11; border: 1px solid #333;
      border-radius: 6px; color: #e5e7eb; padding: 6px 8px;
      line-height: 1.35; font: 13px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      min-height: 30px; resize: vertical;
    }

    /* ===== VIEWPORT ===== */
    #viewport { flex: 1; min-height: 0; position: relative; }
    #viewport canvas { display: block; width: 100%; height: 100%; mix-blend-mode: screen; }
  </style>

  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
      "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js",
      "RoomEnvironment": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/environments/RoomEnvironment.js",
      "Line2": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/lines/Line2.js",
      "LineMaterial": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/lines/LineMaterial.js",
      "LineGeometry": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/lines/LineGeometry.js"
  } }
  </script>
</head>

<body>

  <div class="topbar">
    <div class="panel-toggles">
      <label class="chip"><input id="toggle-geom" type="checkbox" checked /> Geometry & View</label>
      <label class="chip"><input id="toggle-light" type="checkbox" checked /> Lighting</label>
      <label class="chip"><input id="toggle-seg" type="checkbox" checked /> Segments</label>
      <label class="chip"><input id="toggle-typ" type="checkbox" checked /> Typography</label>
      <label class="chip"><input id="toggle-mat" type="checkbox" checked /> Materials</label>
      <label class="chip"><input id="toggle-glow" type="checkbox" checked /> Glow</label>
    </div>

    <div class="panels">
      <div class="ui" id="geom-ui"><h3>Geometry & View</h3><div id="geom-rows"></div></div>
      <div class="ui" id="light-ui"><h3>Lighting</h3><div id="light-rows"></div></div>
      <div class="ui" id="seg-ui"><h3>Segments</h3><div id="seg-rows"></div></div>
      <div class="ui" id="typ-ui"><h3>Typography</h3><div id="typ-rows"></div></div>
      <div class="ui" id="mat-ui"><h3>Materials</h3><div id="mat-rows"></div></div>
      <div class="ui" id="glow-ui"><h3>Glow</h3><div id="glow-rows"></div></div>
    </div>
  </div>

  <div id="viewport"></div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "OrbitControls";
    import { RoomEnvironment } from "RoomEnvironment";
    import { Line2 } from "Line2";
    import { LineMaterial } from "LineMaterial";
    import { LineGeometry } from "LineGeometry";

    /* =========================
       CONFIG
       ========================= */
    const UI = {
      appearance: { elemColor: { label:"Element Color", value: 0x00ff33 } },

      material: {
        type: { label:"Type", value:"physical", options:["standard","physical","phong","basic"] },
        metalness:{label:"Metalness",min:0,max:1,step:0.01,value:0.35},
        roughness:{label:"Roughness",min:0,max:1,step:0.01,value:0.26},
        envIntensity:{label:"EnvMap intensity",min:0,max:5,step:0.05,value:1.2},
        transmission:{label:"Transmission (glass)",min:0,max:1,step:0.01,value:1},
        ior:{label:"IOR",min:1,max:2.5,step:0.01,value:1.93},
        thickness:{label:"Thickness",min:0,max:5,step:0.05,value:2.65},
        attenuationDist:{label:"Attenuation dist",min:0,max:10,step:0.1,value:6.3},
        attenuationColor:{label:"Attenuation color",value:"#a2fff2"},
        clearcoat:{label:"Clearcoat",min:0,max:1,step:0.01,value:0.68},
        clearcoatRough:{label:"Clearcoat rough",min:0,max:1,step:0.01,value:0.57},
        envEnabled:{label:"Environment on",value:true}
      },

      glow: {
        enabled:   { label: "Enable glow", value: true },
        color:     { label: "Glow color", value: "#4DF2FF" },
        intensity: { label: "Intensity", min: 0, max: 3, step: 0.05, value: 1.25 },
        width:     { label: "Width (px)", min: 1, max: 12, step: 1, value: 4 },
        softness:  { label: "Softness", min: 0, max: 1, step: 0.05, value: 0.6 }
      },

      rotation: {
        rx: { label: "Rotate X", min: -180, max: 180, step: 1, value: 14.8 },
        ry: { label: "Rotate Y", min: -180, max: 180, step: 1, value: 30 },
        rz: { label: "Rotate Z", min: -180, max: 180, step: 1, value: -8 },
      },
      geometry: {
        gap:   { label: "Gap (отступ от центра)", min: 0, max: 10, step: 0.1, value: 0.5 },
        relief:{ label: "Relief (высота H)", min: 0, max: 80, step: 1, value: 4 },
        rim:   { label: "Rim (ширина рампы)", min: 0, max: 60, step: 1, value: 10 },
        round: { label: "Roundness (скругление)", min: 1, max: 100, step: 1, value: 32 },
        ratio: { label: "Center ratio (размер центра)", min: 10, max: 60, step: 0.5, value: 26 },
        thick: { label: "Thickness (толщина вниз)", min: 0, max: 30, step: 1, value: 0 },
      },
      lighting: {
        keyI:  { label: "Key intensity", min: 0, max: 300, step: 1, value: 80 },
        keyAz: { label: "Key azimuth (°)", min: 0, max: 360, step: 1, value: 105 },
        keyEl: { label: "Key elevation (°)", min: 0, max: 90, step: 1, value: 42 },
        fillI: { label: "Fill intensity", min: 0, max: 200, step: 1, value: 108 },
        fillAz:{ label: "Fill azimuth (°)", min: 0, max: 360, step: 1, value: 162 },
        fillEl:{ label: "Fill elevation (°)", min: 0, max: 90, step: 1, value: 51 },
        hemiI: { label: "Hemisphere", min: 0, max: 100, step: 1, value: 51 },
        ambI:  { label: "Ambient", min: 0, max: 100, step: 1, value: 73 },
      },
      typography: {
        fontSize:   { label: "Font size (px)", min: 8, max: 64, step: 1, value: 14 },
        fontFamily: { label: "Font family", value: "system-ui", options: [
          "system-ui","Inter","Roboto","Arial","Segoe UI","Open Sans","Montserrat","Noto Sans","PT Sans","Georgia","Times New Roman","monospace"
        ]},
        lineHeight: { label: "Line height", min: 0.8, max: 2.0, step: 0.05, value: 1.5 },
        fontWeight: { label: "Weight", value: "600", options: ["400","500","600","700","800"] },
        textColor:  { label: "Text color", value: "#000000" },
        strokeColor:{ label: "Stroke color", value: "#000000" },
        strokePx:   { label: "Stroke (px)", min: 0, max: 6, step: 1, value: 0 },
        uppercase:  { label: "UPPERCASE", value: true },
        pxToWorld:  { label: "px→world scale", min: 0.005, max: 0.03, step: 0.001, value: 0.012 }
      },
      // 6 сегментов + центр (outline включен у 6 и Центра)
      segments: [
        { name: "Сегмент 1", label: "\n\nпредставление сообщений", opacity: 0.5, gap: 0, outline: false },
        { name: "Сегмент 2", label: "организация внутреннего контроля", opacity: 0.5, gap: 0, outline: false },
        { name: "Сегмент 3", label: "\n\nдобровольное сотрудничество", opacity: 0.5, gap: 0, outline: false },
        { name: "Сегмент 4", label: "самообучение", opacity: 0.5, gap: 0, outline: false },
        { name: "Сегмент 5", label: "\nустранение нарушенений", opacity: 0.5, gap: 0, outline: false },
        { name: "Сегмент 6", label: "\nРабота с перечнем",         opacity: 1,   gap: 0, outline: true  },
        { name: "Центр",     label: "Низкий уровень риска",         opacity: 1,   gap: 0, outline: true  },
      ],
    };

    /* =========================
       SCENE / RENDERER / CONTROLS
       ========================= */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    const vp = document.getElementById('viewport');
    vp.appendChild(renderer.domElement);

    let glowMaterial = null;

    // качество и тонмаппинг
    const DPR = Math.min(2.5, window.devicePixelRatio || 1);
    renderer.setPixelRatio(DPR);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.physicallyCorrectLights = true;

    // HDR окружение
    const pmrem = new THREE.PMREMGenerator(renderer);
    const environmentTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.02).texture;
    scene.environment = environmentTex;

    function sizeRendererToViewport() {
      const w = vp.clientWidth;
      const h = vp.clientHeight || 1;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (glowMaterial) glowMaterial.resolution.set(w, h); // для правильной толщины в px
    }
    sizeRendererToViewport();
    const ro = new ResizeObserver(() => sizeRendererToViewport());
    ro.observe(vp);
    addEventListener('resize', sizeRendererToViewport);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = .08;
    controls.enablePan = false; controls.rotateSpeed = .8;

    // lights
    const key = new THREE.DirectionalLight(0xffffff, .8);
    const fill = new THREE.DirectionalLight(0xffffff, 1.08);
    const hemi = new THREE.HemisphereLight(0xffffff, 0x222222, .51);
    const amb = new THREE.AmbientLight(0xffffff, .73);
    scene.add(key, fill, hemi, amb);

    function setDirLightPolar(light, azDeg, elDeg, dist = 12) {
      const az = THREE.MathUtils.degToRad(azDeg);
      const el = THREE.MathUtils.degToRad(elDeg);
      light.position.set(
        dist * Math.cos(el) * Math.cos(az),
        dist * Math.sin(el),
        dist * Math.cos(el) * Math.sin(az)
      );
    }

    /* =========================
       GEOMETRY (flat-top)
       ========================= */
    const OUTER_R = 3.2;
    const V2 = THREE.Vector2;
    let hexGroup = new THREE.Group(); scene.add(hexGroup);
    let segMeshes = []; let centerMesh = null; let labelMeshes = [];

    function inwardNormal(p, q, centroid) {
      const e = new V2().subVectors(q, p);
      const n = new V2(-e.y, e.x).normalize();
      const mid = new V2().addVectors(p, q).multiplyScalar(.5);
      const toC = new V2().subVectors(centroid, mid);
      return (n.dot(toC) > 0) ? n : n.multiplyScalar(-1);
    }
    function intersectLinesPD(p1, d1, p2, d2) {
      const a = d1.x, b = -d2.x, c = d1.y, d = -d2.y;
      const det = a * d - b * c; if (Math.abs(det) < 1e-8) return p1.clone();
      const rhsx = p2.x - p1.x, rhsy = p2.y - p1.y;
      const t = (rhsx * d - b * rhsy) / det;
      return new V2(p1.x + d1.x * t, p1.y + d1.y * t);
    }
    function hex(r) { // flat-top
      const a0 = 0, pts = [];
      for (let i = 0; i < 6; i++) { const a = a0 + i * Math.PI / 3; pts.push(new V2(r * Math.cos(a), r * Math.sin(a))); }
      return pts;
    }
    const ease = t => (1 - Math.cos(Math.PI * t)) * 0.5;
    function addBand(verts, P, Q, z1, z2) {
      const n = P.length;
      const v = (p, z) => [p.x, p.y, z];
      const tri = (p1, p2, p3, zA, zB, zC) => verts.push(...v(p1, zA), ...v(p2, zB), ...v(p3, zC));
      for (let i = 0; i < n; i++) {
        const p1 = P[i], p2 = P[(i + 1) % n];
        const q1 = Q[i], q2 = Q[(i + 1) % n];
        tri(p1, p2, q2, z1, z1, z2); tri(p1, q2, q1, z1, z2, z2);
      }
    }
    function insetQuad(A, B, C, D, dist) {
      const centroid = new V2((A.x + B.x + C.x + D.x) / 4, (A.y + B.y + C.y + D.y) / 4);
      const P = [A, B, C, D], lines = [];
      for (let i = 0; i < 4; i++) {
        const p = P[i], q = P[(i + 1) % 4];
        const n = inwardNormal(p, q, centroid);
        const d = new V2(-n.y, n.x);
        const pShift = new V2().addVectors(p, n.clone().multiplyScalar(dist));
        lines.push({ p: pShift, d });
      }
      return [
        intersectLinesPD(lines[3].p, lines[3].d, lines[0].p, lines[0].d),
        intersectLinesPD(lines[0].p, lines[0].d, lines[1].p, lines[1].d),
        intersectLinesPD(lines[1].p, lines[1].d, lines[2].p, lines[2].d),
        intersectLinesPD(lines[2].p, lines[2].d, lines[3].p, lines[3].d),
      ];
    }
    function quadCentroid(Q) { return new V2((Q[0].x + Q[1].x + Q[2].x + Q[3].x) / 4, (Q[0].y + Q[1].y + Q[2].y + Q[3].y) / 4); }
    function minEdgeLen(pts) { let m=Infinity; for(let i=0;i<pts.length;i++){ const a=pts[i],b=pts[(i+1)%pts.length]; m=Math.min(m,a.distanceTo(b)); } return m; }

    /* ===== materials ===== */
    function buildMaterial(opacity = 1) {
      const col = UI.appearance.elemColor.value;
      const m = UI.material, type = m.type.value;
      let mat;
      if (type === "physical") {
        mat = new THREE.MeshPhysicalMaterial({
          color: col,
          metalness: +m.metalness.value,
          roughness: +m.roughness.value,
          clearcoat: +m.clearcoat.value,
          clearcoatRoughness: +m.clearcoatRough.value,
          transmission: +m.transmission.value,
          ior: +m.ior.value,
          thickness: +m.thickness.value,
          attenuationColor: new THREE.Color(m.attenuationColor.value),
          attenuationDistance: +m.attenuationDist.value || 0,
          envMapIntensity: +m.envIntensity.value,
          transparent: true, opacity,
          side: THREE.DoubleSide
        });
      } else if (type === "standard") {
        mat = new THREE.MeshStandardMaterial({
          color: col,
          metalness: +m.metalness.value,
          roughness: +m.roughness.value,
          envMapIntensity: +m.envIntensity.value,
          transparent: opacity < 1, opacity,
          side: THREE.DoubleSide
        });
      } else if (type === "phong") {
        mat = new THREE.MeshPhongMaterial({
          color: col, shininess: 80, specular: new THREE.Color(0xdddddd),
          transparent: opacity < 1, opacity,
          side: THREE.DoubleSide
        });
      } else {
        mat = new THREE.MeshBasicMaterial({ color: col, transparent: opacity < 1, opacity, side: THREE.DoubleSide });
      }
      scene.environment = m.envEnabled.value ? environmentTex : null;
      return mat;
    }

    /* ===== labels (CanvasTexture) ===== */
    function wrapLinesByWidth(ctx, text, maxW) {
      const norm = String(text || "").replace(/&nbsp;/gi, "\u00A0").replace(/~/g, "\u00A0");
      const rawLines = norm.split(/\r?\n|\\n|<br\s*\/?>|\|/i);
      const lines = [];
      for (const raw of rawLines) {
        const words = raw.split(/[ \t]+/);
        let cur = "";
        for (const w of words) {
          const sep = (cur === "" ? "" : " ");
          const test = cur + sep + w;
          if (ctx.measureText(test).width <= maxW) cur = test;
          else { if (cur) lines.push(cur); if (ctx.measureText(w).width > maxW) { lines.push(w); cur=""; } else cur = w; }
        }
        lines.push(cur);
      }
      return lines;
    }
    function makeTextPlaneMulti(text, maxWorldWidth, opts) {
      const { family, sizePx, weight, lineHeight, color, strokeColor, strokePx, pxToWorld } = opts;
      const DPR = Math.min(2.5, window.devicePixelRatio || 1), SS = 2;
      const maxPxWidth = Math.max(20, Math.round(maxWorldWidth / pxToWorld));
      const scalePx = DPR * SS;

      const tmp = document.createElement('canvas');
      const ctx = tmp.getContext('2d');
      ctx.font = `${weight} ${sizePx * scalePx}px "${family}"`;

      const lines = wrapLinesByWidth(ctx, text, maxPxWidth * scalePx);
      const padX = Math.round(sizePx * 0.6 * scalePx);
      const padY = Math.round(sizePx * 0.5 * scalePx);
      const width = Math.max(maxPxWidth * scalePx + padX * 2, ...lines.map(t => ctx.measureText(t).width + padX * 2));
      const height = Math.round(lines.length * sizePx * lineHeight * scalePx + padY * 2);

      tmp.width = Math.max(2, Math.ceil(width));
      tmp.height = Math.max(2, Math.ceil(height));

      const c2 = tmp.getContext('2d');
      c2.font = `${weight} ${sizePx * scalePx}px "${family}"`;
      c2.textAlign = 'center'; c2.textBaseline = 'middle';
      const cx = tmp.width/2;
      let y = padY + sizePx * 0.7 * scalePx;
      const dy = sizePx * lineHeight * scalePx;

      if (strokePx>0){ c2.lineWidth = strokePx * scalePx; c2.strokeStyle = strokeColor; }
      c2.fillStyle = color;
      for (const ln of lines){ if (strokePx>0) c2.strokeText(ln,cx,y); c2.fillText(ln,cx,y); y+=dy; }

      const tex = new THREE.CanvasTexture(tmp);
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      tex.minFilter = THREE.LinearMipMapLinearFilter; tex.magFilter = THREE.LinearFilter; tex.generateMipmaps = true;
      const worldW = (tmp.width / scalePx) * pxToWorld, worldH = (tmp.height / scalePx) * pxToWorld;
      const geo = new THREE.PlaneGeometry(worldW, worldH);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite:false, depthTest:false, polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 });
      const mesh = new THREE.Mesh(geo, mat); mesh.renderOrder = 999; return mesh;
    }

    function disposeLabelMesh(m){ if(!m)return; m.parent&&m.parent.remove(m); m.geometry?.dispose(); if(m.material?.map)m.material.map.dispose(); m.material?.dispose(); }
    function removeAllLabels(){
      segMeshes.forEach(seg=>{ if(!seg)return; [...seg.children].forEach(ch=>{ if(ch?.userData?.isLabel) disposeLabelMesh(ch); }); });
      if (centerMesh){ [...centerMesh.children].forEach(ch=>{ if(ch?.userData?.isLabel) disposeLabelMesh(ch); }); }
      labelMeshes = [];
    }

    /* ===== glow lines ===== */
    let glowGroup = new THREE.Group(); // добавим внутрь hexGroup в rebuild()

    function makeGlowMaterial(){
      const G = UI.glow;
      const mat = new LineMaterial({
        color: new THREE.Color(G.color.value).multiplyScalar(G.intensity.value).getHex(),
        linewidth: Math.max(1, +G.width.value), // px
        transparent: true,
        opacity: THREE.MathUtils.clamp(G.softness.value, 0, 1),
        depthTest: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        dashed: false
      });
      const w = vp.clientWidth || renderer.domElement.width;
      const h = vp.clientHeight || renderer.domElement.height;
      mat.resolution.set(w, h);
      return mat;
    }

    // непрерывные петли (внешняя и внутренняя)
    function rebuildGlowLines(outerHex, innerHex) {
      // очистка
      glowGroup.children.slice().forEach(ch => {
        ch.geometry?.dispose?.();
        if (ch.material && ch.material !== glowMaterial) ch.material.dispose();
        glowGroup.remove(ch);
      });

      const g = UI.geometry;
      const gapWorld = +g.gap.value / 20;

      // трансляции сегментов
      const segTrans = [];
      for (let i = 0; i < 6; i++) {
        const A = outerHex[i], B = outerHex[(i+1)%6], C = innerHex[(i+1)%6], D = innerHex[i];
        const cx = (A.x + B.x + C.x + D.x) / 4;
        const cy = (A.y + B.y + C.y + D.y) / 4;
        const len = Math.hypot(cx, cy) || 1;
        const extra = (gapWorld + (+UI.segments[i].gap || 0)/20);
        segTrans[i] = new THREE.Vector2((cx/len)*extra, (cy/len)*extra);
      }

      const Z_BACK = -(+UI.geometry.thick.value/20) - 0.002;

      function addPolyline(points, closed=false){
        if (points.length < 2) return;
        const positions = [];
        for (const p of points) positions.push(p.x, p.y, Z_BACK);
        if (closed) { // замыкаем
          positions.push(points[0].x, points[0].y, Z_BACK);
        }
        const geom = new LineGeometry();
        geom.setPositions(positions);
        const line = new Line2(geom, glowMaterial);
        line.computeLineDistances();
        line.renderOrder = 10;
        glowGroup.add(line);
      }

      // -------- ВНЕШНИЙ КОНТУР (между сегментами) --------
      const outerMid = [];
      for (let v = 0; v < 6; v++) {
        const iL = (v + 5) % 6;
        const iR = v;
        const midShift = segTrans[iL].clone().add(segTrans[iR]).multiplyScalar(0.5);
        outerMid.push(outerHex[v].clone().add(midShift));
      }
      // разбиваем на дуги по XOR(check) соседей
      (function buildOuter(){
        const edgesNeed = [];
        for (let v=0; v<6; v++){
          const i = v;
          const j = (v+5)%6;
          edgesNeed[v] = !!(UI.segments[i].outline ^ UI.segments[j].outline);
        }
        // собрать непрерывные участки (возможно один замкнутый по кругу)
        let arcs = [];
        let cur = [];
        for (let v=0; v<6; v++){
          const need = edgesNeed[v];
          const pA = outerMid[v];
          const pB = outerMid[(v+1)%6];
          if (need){
            if (cur.length === 0) cur.push(pA);
            cur.push(pB);
          } else {
            if (cur.length > 1){ arcs.push({pts: cur.slice(), wrap:false}); }
            cur = [];
          }
        }
        // хвост через границу
        if (cur.length > 1){
          if (edgesNeed[0] && edgesNeed[5]){
            // склеиваем в замкнутую
            const first = arcs[0]?.pts || [];
            const merged = cur.concat(first);
            if (first.length) arcs.shift();
            arcs.unshift({pts: merged, wrap:true});
          } else {
            arcs.push({pts: cur.slice(), wrap:false});
          }
        }
        arcs.forEach(a => addPolyline(a.pts, a.wrap));
      })();

      // -------- ВНУТРЕННИЙ КОНТУР (между центром и сегментами) --------
      const innerMid = [];
      for (let v=0; v<6; v++){
        // середина между центром (innerHex[v]) и тем же смещённым у сегмента v
        const p = innerHex[v].clone().add(segTrans[v].clone().multiplyScalar(0.5));
        innerMid.push(p);
      }
      (function buildInner(){
        const edgesNeed = [];
        for (let v=0; v<6; v++){
          const i = v; // сегмент вдоль ребра [v..v+1] с центром
          edgesNeed[v] = !!(UI.segments[i].outline ^ UI.segments[6].outline);
        }
        let arcs = [];
        let cur = [];
        for (let v=0; v<6; v++){
          const need = edgesNeed[v];
          const pA = innerMid[v];
          const pB = innerMid[(v+1)%6];
          if (need){
            if (cur.length === 0) cur.push(pA);
            cur.push(pB);
          } else {
            if (cur.length > 1){ arcs.push({pts: cur.slice(), wrap:false}); }
            cur = [];
          }
        }
        if (cur.length > 1){
          if (edgesNeed[0] && edgesNeed[5]){
            const first = arcs[0]?.pts || [];
            const merged = cur.concat(first);
            if (first.length) arcs.shift();
            arcs.unshift({pts: merged, wrap:true});
          } else {
            arcs.push({pts: cur.slice(), wrap:false});
          }
        }
        arcs.forEach(a => addPolyline(a.pts, a.wrap));
      })();
    }

    /* ===== labels building ===== */
    function rebuildLabels(outer, inner, rim, H) {
      removeAllLabels();
      const typ = UI.typography;
      const pxToWorld = +typ.pxToWorld.value;

      // 6 сегментов
      for (let i = 0; i < 6; i++) {
        const A = outer[i], B = outer[(i + 1) % 6], C = inner[(i + 1) % 6], D = inner[i];
        const top = insetQuad(A, B, C, D, rim);
        const centroid = quadCentroid(top);
        const avail = minEdgeLen(top) * 0.92;
        const segCfg = UI.segments[i];
        const labelText = (typ.uppercase.value ? (segCfg.label || "").toUpperCase() : (segCfg.label || ""));
        const mesh = makeTextPlaneMulti(labelText, avail, {
          family: UI.typography.fontFamily.value,
          sizePx: +UI.typography.fontSize.value,
          weight: UI.typography.fontWeight.value,
          lineHeight: +UI.typography.lineHeight.value,
          color: UI.typography.textColor.value,
          strokeColor: UI.typography.strokeColor.value,
          strokePx: +UI.typography.strokePx.value,
          pxToWorld
        });
        mesh.userData.isLabel = true;
        mesh.position.set(centroid.x, centroid.y, H + 0.01);
        segMeshes[i].add(mesh);
        labelMeshes[i] = mesh;
      }

      // центр (убран базовый офсет от rim!)
      const centroid = new V2(0, 0);
      const mkInsetHex = (k) => {
        const lines = [];
        for (let i = 0; i < 6; i++) {
          const p = inner[i], q = inner[(i + 1) % 6];
          const n = inwardNormal(p, q, centroid);
          const d = new V2(-n.y, n.x);
          const pShift = new V2().addVectors(p, n.clone().multiplyScalar(k)); // только k
          lines.push({ p: pShift, d });
        }
        const poly = [];
        for (let i = 0; i < 6; i++) {
          const L1 = lines[(i + 5) % 6], L2 = lines[i];
          poly.push(intersectLinesPD(L1.p, L1.d, L2.p, L2.d));
        }
        return poly;
      };
      const hexTop = mkInsetHex(rim * 0.8);
      const centerAvail = minEdgeLen(hexTop) * 0.95;
      const cCfg = UI.segments[6];
      const cLabel = (UI.typography.uppercase.value ? (cCfg.label || "").toUpperCase() : (cCfg.label || ""));
      const cMesh = makeTextPlaneMulti(cLabel, centerAvail, {
        family: UI.typography.fontFamily.value,
        sizePx: +UI.typography.fontSize.value,
        weight: UI.typography.fontWeight.value,
        lineHeight: +UI.typography.lineHeight.value,
        color: UI.typography.textColor.value,
        strokeColor: UI.typography.strokeColor.value,
        strokePx: +UI.typography.strokePx.value,
        pxToWorld: +UI.typography.pxToWorld.value
      });
      cMesh.userData.isLabel = true;
      cMesh.position.set(0, 0, H + 0.012);
      centerMesh.add(cMesh);
      labelMeshes[6] = cMesh;
    }

    /* =========================
       BUILD & BINDINGS
       ========================= */
    function fitCameraToObject(obj) {
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3(); box.getSize(size);
      const center = new THREE.Vector3(); box.getCenter(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const fov = camera.fov * (Math.PI / 180);
      let dist = (maxDim / 2) / Math.tan(fov / 2); dist *= 1.35;
      camera.position.set(center.x, center.y, dist);
      camera.near = dist / 100; camera.far = dist * 10; camera.updateProjectionMatrix();
      controls.target.copy(center); camera.lookAt(center);
    }

    function rebuild() {
      const g = UI.geometry;
      const rot = UI.rotation;
      const roundSteps = +g.round.value;
      const H = +g.relief.value / 20;
      const rim = +g.rim.value / 40;
      const ratio = +g.ratio.value / 100;
      const T = +g.thick.value / 20;

      scene.remove(hexGroup);
      hexGroup = new THREE.Group();
      segMeshes = [];
      removeAllLabels();

      const outer = hex(OUTER_R);
      const inner = hex(OUTER_R * ratio);

      // 6 сегментов
      const gapWorld = +g.gap.value / 20;
      for (let i = 0; i < 6; i++) {
        const A = outer[i], B = outer[(i + 1) % 6], C = inner[(i + 1) % 6], D = inner[i];
        const sCfg = UI.segments[i];
        const vertsGeo = (function(){
          const verts = []; const quad = (p1,p2,p3,p4,z)=>{ const v=(p,z)=>[p.x,p.y,z]; const tri=(a,b,c)=>verts.push(...v(a,z),...v(b,z),...v(c,z)); tri(p1,p2,p3); tri(p1,p3,p4); };
          const outerQ=[A,B,C,D]; let prev=outerQ, prevZ=0, poly=null;
          const maxInset=Math.min(A.distanceTo(B),B.distanceTo(C),C.distanceTo(D),D.distanceTo(A))*0.24;
          const s=Math.min(Math.max(rim,0),maxInset); const stepsH=Math.max(1,Math.floor(roundSteps));
          for(let k=1;k<=stepsH;k++){ const t=k/stepsH, zi=H*ease(t), si=s*t; poly=insetQuad(A,B,C,D,si); addBand(verts,prev,poly,prevZ,zi); prev=poly; prevZ=zi; }
          quad(poly[0],poly[1],poly[2],poly[3],prevZ);
          if(T>0){ const Zb=-T; quad(D,C,B,A,Zb); const stepsV=Math.max(1,Math.floor(roundSteps));
            const maxSideInset=Math.min(s*0.45,Math.min(A.distanceTo(B),B.distanceTo(C),C.distanceTo(D),D.distanceTo(A))*0.08);
            let prevC=outerQ, prevVz=0; for(let k=1;k<=stepsV;k++){ const t=k/stepsV, zi=-T*ease(t), cont=insetQuad(A,B,C,D,maxSideInset*ease(t)); addBand(verts,prevC,cont,prevVz,zi); prevC=cont; prevVz=zi; }
            const maxInnerOut=Math.min(s*0.35,Math.min(A.distanceTo(B),B.distanceTo(C),C.distanceTo(D),D.distanceTo(A))*0.06);
            let prevCi=poly, prevZi=prevZ; for(let k=1;k<=stepsV;k++){ const t=k/stepsV, zi=prevZ+(-T-prevZ)*ease(t); const cont=insetQuad(A,B,C,D,s-maxInnerOut*ease(t)); addBand(verts,prevCi,cont,prevZi,zi); prevCi=cont; prevZi=zi; }
          }
          const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3)); geo.computeVertexNormals(); return geo;
        })();

        const seg = new THREE.Mesh(vertsGeo, buildMaterial(sCfg.opacity));

        // радиальный сдвиг
        const cx = (A.x + B.x + C.x + D.x) / 4;
        const cy = (A.y + B.y + C.y + D.y) / 4;
        const len = Math.hypot(cx, cy) || 1;
        const extra = (gapWorld + (+sCfg.gap || 0) / 20);
        seg.position.set((cx / len) * extra, (cy / len) * extra, 0);

        segMeshes.push(seg); hexGroup.add(seg);
      }

      // центр (без базового rim-сдвига)
      (function(){
        const centroid = new V2(0, 0);
        const mkInsetHex = (k) => {
          const lines = []; for (let i = 0; i < 6; i++) {
            const p = inner[i], q = inner[(i + 1) % 6];
            const n = inwardNormal(p, q, centroid);
            const d = new V2(-n.y, n.x);
            const pShift = new V2().addVectors(p, n.clone().multiplyScalar(k)); // только k
            lines.push({ p: pShift, d });
          }
          const poly = []; for (let i = 0; i < 6; i++) {
            const L1 = lines[(i + 5) % 6], L2 = lines[i];
            poly.push(intersectLinesPD(L1.p, L1.d, L2.p, L2.d));
          }
          return poly;
        };
        const verts=[]; const tri=(p1,p2,p3,z1,z2,z3)=>{ const v=(p,z)=>[p.x,p.y,z]; verts.push(...v(p1,z1),...v(p2,z2),...v(p3,z3)); };
        const stepsH=Math.max(1,Math.floor(roundSteps)); let prevPoly=inner, prevZ=0, poly=null;
        for(let i=1;i<=stepsH;i++){ const t=i/stepsH, zi=H*ease(t); poly=mkInsetHex((rim*0.8)*t); addBand(verts,prevPoly,poly,prevZ,zi); prevPoly=poly; prevZ=zi; }
        for(let i=1;i<5;i++) tri(poly[0],poly[i],poly[i+1],prevZ,prevZ,prevZ);
        if (T>0){ const Zb = -T; for(let i=1;i<5;i++) tri(inner[0],inner[i+1],inner[i],Zb,Zb,Zb); }
        const geo=new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(verts,3)); geo.computeVertexNormals();
        centerMesh = new THREE.Mesh(geo, buildMaterial(UI.segments[6].opacity));
        hexGroup.add(centerMesh);
      })();

      hexGroup.rotation.z = THREE.MathUtils.degToRad(+rot.rz.value);
      // привязываем неон к фигуре (важно!)
      hexGroup.add(glowGroup);

      scene.add(hexGroup);
      fitCameraToObject(hexGroup);
      applyCameraFromSliders();

      // labels & glow
      rebuildLabels(outer, inner, +g.rim.value/40, +g.relief.value/20);
      if (!glowMaterial) glowMaterial = makeGlowMaterial();
      if (UI.glow.enabled.value) rebuildGlowLines(outer, inner);
      glowGroup.visible = !!UI.glow.enabled.value;
    }

    /* ---------- UI генерация ---------- */
    const geomRows = document.getElementById('geom-rows');
    const lightRows = document.getElementById('light-rows');
    const segRows = document.getElementById('seg-rows');
    const typRows = document.getElementById('typ-rows');
    const matRows = document.getElementById('mat-rows');
    const glowRows = document.getElementById('glow-rows');

    function intToHex6(n) { return '#' + (n >>> 0).toString(16).padStart(6, '0').toUpperCase(); }
    function hex6ToInt(s) { const m=(s||'').trim().replace(/^#/,'').match(/^[0-9a-fA-F]{6}$/); return m?parseInt(m[0],16):null; }

    function rowRangeNumber(container, id, cfg) {
      const wrap = document.createElement('div'); wrap.className = 'row';
      const label = document.createElement('label'); label.textContent = cfg.label; label.htmlFor = id;
      const range = document.createElement('input'); range.type = 'range';
      range.id = id; range.min = cfg.min; range.max = cfg.max; range.step = cfg.step; range.value = cfg.value;
      const num = document.createElement('input'); num.type = 'number';
      num.id = id + '-n'; num.min = cfg.min; num.max = cfg.max; num.step = cfg.step; num.value = cfg.value;
      wrap.append(label, range, num); container.appendChild(wrap);
      const apply = (v) => { const vv = Math.max(+cfg.min, Math.min(+cfg.max, +v)); range.value = num.value = vv; cfg.value = vv; };
      range.addEventListener('input', () => { apply(range.value); onAnyChange(id); });
      num.addEventListener('input', () => { apply(num.value); onAnyChange(id); });
      return { range, num, apply };
    }
    function rowSelect(container, id, cfg) {

      sel.value = cfg.value;
      wrap.append(label, sel); container.appendChild(wrap);

    function rowCheckbox(container, id, cfg) {

      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = !!cfg.value;

    // Geometry & View
    const rotRows = {};
    rotRows.rx = rowRangeNumber(geomRows, 'rx', UI.rotation.rx);

    // Appearance (глобальный цвет)
    (() => {

      hex.style.borderRadius = '6px'; hex.style.color = '#e5e7eb'; hex.style.padding = '4px 6px';

    // Lighting
    for (const key of Object.keys(UI.lighting)) { rowRangeNumber(lightRows, key, UI.lighting[key]); }

    // Segments (outline чекбокс)
    const segGrid = document.createElement('div'); segGrid.className = 'seg-grid';
    segGrid.innerHTML = `
      <div class="hdr seg-name">Элемент</div>

    `;
    UI.segments.forEach((seg, i) => {

      labelInput.rows = 1;

      function autosize(el){ el.style.height='auto'; el.style.height=Math.min(160, el.scrollHeight)+'px'; }

      const gap = document.createElement('input'); gap.type='number'; gap.min=0; gap.max=10; gap.step=0.1; gap.value=seg.gap;
      if (i === 6) { gap.disabled = true; gap.title = 'Центр не сдвигается индивидуально'; }
      const chk = document.createElement('input'); chk.type='checkbox'; chk.checked=!!seg.outline;

      labelInput.addEventListener('input', () => { seg.label = labelInput.value || ""; updateAllLabelsOnly(); });

    segRows.appendChild(segGrid);

    // Typography

      wrap1.append(l1, c1, hex1); typRows.appendChild(wrap1);

      c1.addEventListener('input', ()=>apply1(c1.value));
      hex1.addEventListener('input', ()=>{ const s=hex1.value.trim(); if(/^#?[0-9a-fA-F]{6}$/.test(s.replace('#',''))){ apply1('#'+s.replace('#','')); hex1.style.borderColor='#333'; } else { hex1.style.borderColor='#a33'; } });

      const wrap2 = document.createElement('div'); wrap2.className = 'row';
      const l2 = document.createElement('label'); l2.textContent = "Stroke color";

      const hex2 = document.createElement('input'); hex2.type = 'text'; hex2.value = t.strokeColor.value; hex2.style.width = '110px';
      hex2.style.background = '#0e0f11'; hex2.style.border = '1px solid #333'; hex2.style.borderRadius = '6px'; hex2.style.color = '#e5e7eb'; hex2.style.padding = '4px 6px';
      wrap2.append(l2, c2, hex2); typRows.appendChild(wrap2);

      c2.addEventListener('input', ()=>apply2(c2.value));
      hex2.addEventListener('input', ()=>{ const s=hex2.value.trim(); if(/^#?[0-9a-fA-F]{6}$/.test(s.replace('#',''))){ apply2('#'+s.replace('#','')); hex2.style.borderColor='#333'; } else { hex2.style.borderColor='#a33'; } });

      const l = document.createElement('label'); l.textContent = UI.glow.color.label;
      const c = document.createElement('input'); c.type='color'; c.value = UI.glow.color.value;
      const h = document.createElement('input'); h.type='text'; h.value = UI.glow.color.value; h.style.width='110px';
      h.style.background='#0e0f11'; h.style.border='1px solid #333'; h.style.borderRadius='6px'; h.style.color='#e5e7eb'; h.style.padding='4px 6px';
      rColor.append(l,c,h); glowRows.appendChild(rColor);
      const apply = v=>{ UI.glow.color.value=v; glowMaterial && (glowMaterial.color.set(v).multiplyScalar(UI.glow.intensity.value)); };
      c.addEventListener('input', ()=>{ apply(c.value); });
      h.addEventListener('input', ()=>{ const s=h.value.replace('#',''); if(/^[0-9a-f]{6}$/i.test(s)){ apply('#'+s); h.style.borderColor='#333'; } else { h.style.borderColor='#a33'; } });
    })();
    rowRangeNumber(glowRows, 'intensity', UI.glow.intensity);
    rowRangeNumber(glowRows, 'width', UI.glow.width);
    rowRangeNumber(glowRows, 'softness', UI.glow.softness);

    /* ---------- updates ---------- */
    function updateMaterials() {
      segMeshes.forEach((m, i) => {
        if (!m) return;
        const op = UI.segments[i].opacity;
        const old = m.material;
        m.material = buildMaterial(op);
        old?.dispose?.();
      });
      if (centerMesh) {
        const old = centerMesh.material;
        centerMesh.material = buildMaterial(UI.segments[6].opacity);
        old?.dispose?.();
      }
      renderer.render(scene, camera);
    }

    function updateAllLabelsOnly() {
      const g = UI.geometry;
      const H = +g.relief.value / 20;
      const rim = +g.rim.value / 40;
      const ratio = +g.ratio.value / 100;
      const outer = hex(OUTER_R);
      const inner = hex(OUTER_R * ratio);
      rebuildLabels(outer, inner, rim, H);
    }

    function onAnyChange(id) {
      // геометрия и повороты
      if (id in UI.geometry || id === 'rz' || id === 'rx' || id === 'ry') {
        if (id === 'rx' || id === 'ry' || id === 'rz') {
          if (id === 'rz') hexGroup.rotation.z = THREE.MathUtils.degToRad(+UI.rotation.rz.value);
          else applyCameraFromSliders();
        }
        if (id !== 'rx' && id !== 'ry' && id !== 'rz') rebuild();
      }
      // свет
      if (id in UI.lighting) applyLightsFromUI();

      // типографика
      if (id === 'fontSize' || id === 'lineHeight' || id === 'fontFamily' || id === 'fontWeight' || id === 'uppercase' || id === 'strokePx' || id === 'textColor' || id === 'strokeColor' || id === 'pxToWorld') {
        updateAllLabelsOnly();
      }

      // материалы
      if (id in UI.material || id === 'mat-type') updateMaterials();

      // glow
      if (id.startsWith('glow') || id === 'intensity' || id === 'width' || id === 'softness') {
        if (!glowMaterial) glowMaterial = makeGlowMaterial();
        glowMaterial.linewidth = Math.max(1, +UI.glow.width.value);
        glowMaterial.color.set(UI.glow.color.value).multiplyScalar(+UI.glow.intensity.value);
        glowMaterial.opacity = THREE.MathUtils.clamp(+UI.glow.softness.value, 0, 1);
        glowGroup.visible = !!UI.glow.enabled.value;
        rebuild(); // перестроить линии с учётом включений/выключений
      }

      requestAnimationFrame(sizeRendererToViewport);
    }

    /* ---------- Orbit ↔ sliders sync ---------- */
    let suppressSliderSync = false;
    controls.addEventListener('change', () => {
      if (suppressSliderSync) return;
      const az = controls.getAzimuthalAngle();
      const pol = controls.getPolarAngle();
      const rxDeg = THREE.MathUtils.radToDeg(pol - Math.PI / 2);
      const ryDeg = THREE.MathUtils.radToDeg(az);
      suppressSliderSync = true;
      UI.rotation.rx.value = rxDeg; rotRows.rx.range.value = rxDeg; rotRows.rx.num.value = rxDeg;
      UI.rotation.ry.value = ryDeg; rotRows.ry.range.value = ryDeg; rotRows.ry.num.value = ryDeg;
      suppressSliderSync = false;
    });

    function applyCameraFromSliders() {
      const rx = THREE.MathUtils.degToRad(+UI.rotation.rx.value);
      const ry = THREE.MathUtils.degToRad(+UI.rotation.ry.value);
      const polar = THREE.MathUtils.clamp(rx + Math.PI / 2, 0.01, Math.PI - 0.01);
      const azim = ry;
      suppressSliderSync = true;
      controls.minPolarAngle = controls.maxPolarAngle = polar;
      controls.minAzimuthAngle = controls.maxAzimuthAngle = azim;
      controls.update();
      setTimeout(() => {
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = Math.PI;
        controls.minAzimuthAngle = -Infinity;
        controls.maxAzimuthAngle = Infinity;
        suppressSliderSync = false;
      }, 0);
    }

    /* ---------- lights ---------- */
    function applyLightsFromUI() {
      const L = UI.lighting;
      key.intensity = +L.keyI.value / 100;
      fill.intensity = +L.fillI.value / 100;
      hemi.intensity = +L.hemiI.value / 100;
      amb.intensity = +L.ambI.value / 100;
      setDirLightPolar(key, +L.keyAz.value, +L.keyEl.value);
      setDirLightPolar(fill, +L.fillAz.value, +L.fillEl.value);
    }

    /* ---------- panel toggles ---------- */
    const toggleMap = [
      ['toggle-geom', 'geom-ui'],
      ['toggle-light', 'light-ui'],
      ['toggle-seg', 'seg-ui'],
      ['toggle-typ', 'typ-ui'],
      ['toggle-mat', 'mat-ui'],
      ['toggle-glow','glow-ui'],
    ];
    toggleMap.forEach(([chk, panel]) => {
      const c = document.getElementById(chk);
      const p = document.getElementById(panel);
      c.addEventListener('change', () => {
        p.classList.toggle('hidden', !c.checked);
        requestAnimationFrame(sizeRendererToViewport);
      });
    });

    /* ---------- start ---------- */
    glowMaterial = makeGlowMaterial(); // заранее, чтобы есть resolution
    rebuild();
    applyLightsFromUI();

    (function loop() {
      requestAnimationFrame(loop);
      controls.update();
      renderer.render(scene, camera);
    })();
  </script>
</body>
</html>
